<!DOCTYPE html>
<html>
<head>
  <title>Appointments</title>
</head>
<body style="background:#0b1b34;color:white;font-family:sans-serif">

<h1>📅 Appointments</h1>

<input id="customer" placeholder="Customer">
<input id="service" placeholder="Service">
<input id="date" type="date">
<button onclick="addAppointment()">Book</button>

<ul id="list"></ul>

<script>
const API = "https://spamate-backend.onrender.com";

async function addAppointment() {
  const customer = document.getElementById("customer").value;
  const service = document.getElementById("service").value;
  const date = document.getElementById("date").value;

  await fetch(`${API}/api/appointments`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ customer, service, date })
  });

  loadAppointments();
}

async function loadAppointments() {
  const res = await fetch(`${API}/api/appointments`);
  const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(a => {
    const li = document.createElement("li");
    li.textContent = `${a.customer} - ${a.service} - ${a.date}`;
    list.appendChild(li);
  });
}

loadAppointments();
</script>

</body>
</html>
