<!DOCTYPE html>
<html>
<head>
    <title>Customers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">

<h1 class="text-center">Customers</h1>

<div class="card p-3">
    <input id="name" class="form-control mb-2" placeholder="Name">
    <input id="phone" class="form-control mb-2" placeholder="Phone">
    <button class="btn btn-primary" onclick="addCustomer()">Add</button>
</div>

<button class="btn btn-secondary mt-3" onclick="loadCustomers()">Load Customers</button>

<ul id="list" class="mt-3"></ul>

<script>
async function addCustomer() {
    await fetch('http://localhost:5000/addCustomer', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value
        })
    });
    alert("Added");
}

async function loadCustomers() {
    const res = await fetch('http://localhost:5000/customers');
    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = "";

    data.forEach(c => {
        const li = document.createElement('li');
        li.innerText = c.name + " - " + c.phone;
        list.appendChild(li);
    });
}
</script>

</div>
</body>
</html>
