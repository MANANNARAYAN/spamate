<!DOCTYPE html>
<html>
<body style="background:#0f172a;color:white;font-family:Arial;">

<h1>📈 Reports</h1>

<button onclick="load()">Load Reports</button>

<ul id="list"></ul>

<script>
const API = "https://spamate-backend.onrender.com";

function load(){
  fetch(`${API}/reports`)
  .then(res=>res.json())
  .then(data=>{
    list.innerHTML="";
    data.forEach(r=>{
      const li=document.createElement("li");
      li.innerText=JSON.stringify(r);
      list.appendChild(li);
    });
  });
}
</script>

</body>
</html>
