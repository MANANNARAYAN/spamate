<!DOCTYPE html>
<html>
<head>
    <title>Reports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">

<h1 class="text-center">Reports</h1>

<div class="d-grid gap-2">
    <button class="btn btn-primary" onclick="loadCustomers()">Total Customers</button>
    <button class="btn btn-success" onclick="loadAppointments()">Total Appointments</button>
</div>

<h2 id="result" class="mt-4 text-center"></h2>

<script>
async function loadCustomers() {
    const res = await fetch('http://localhost:5000/customers');
    const data = await res.json();
    document.getElementById('result').innerText = "Customers: " + data.length;
}

async function loadAppointments() {
    const res = await fetch('http://localhost:5000/appointments');
    const data = await res.json();
    document.getElementById('result').innerText = "Appointments: " + data.length;
}
</script>

</div>
</body>
</html>
