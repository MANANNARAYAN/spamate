<button onclick="load()">Load Reports</button>
<div id="data"></div>

<script>
const API = "https://spamate-backend.onrender.com";

async function load() {
  const a = await fetch(`${API}/api/appointments`).then(r=>r.json());
  const b = await fetch(`${API}/api/billing`).then(r=>r.json());

  data.innerHTML = `
    <p>Total Appointments: ${a.length}</p>
    <p>Total Billing Entries: ${b.length}</p>
  `;
}
</script>
