<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">
<div class="container mt-5">

<h1 class="text-center">Dashboard</h1>

<p id="role" class="text-center"></p>

<div class="d-grid gap-2 mb-4">
    <button class="btn btn-primary" onclick="goToCustomers()">Customers</button>
    <button class="btn btn-success" onclick="goToAppointments()">Appointments</button>
    <button class="btn btn-warning" onclick="goToBilling()">Billing</button>
    <button class="btn btn-info" onclick="goToReports()">Reports</button>
    <button class="btn btn-danger" onclick="logout()">Logout</button>
</div>

<canvas id="chart"></canvas>

<script>
const user = JSON.parse(localStorage.getItem("user"));
if (!user) window.location.href = "login.html";

document.getElementById("role").innerText = "Role: " + user.role;

function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
}

function goToCustomers() { window.location.href = "index.html"; }
function goToAppointments() { window.location.href = "appointments.html"; }
function goToBilling() { window.location.href = "billing.html"; }
function goToReports() { window.location.href = "reports.html"; }

async function loadChart() {
    const customers = await fetch('http://localhost:5000/customers').then(r => r.json());
    const appointments = await fetch('http://localhost:5000/appointments').then(r => r.json());

    new Chart(document.getElementById('chart'), {
        type: 'bar',
        data: {
            labels: ['Customers', 'Appointments'],
            datasets: [{
                label: 'Overview',
                data: [customers.length, appointments.length]
            }]
        }
    });
}
loadChart();
</script>

</div>
</body>
</html>
