<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      margin: 0;
    }
    .nav {
      background: #1e293b;
      padding: 15px;
      display: flex;
      gap: 20px;
    }
    .nav a {
      color: white;
      text-decoration: none;
    }
    .container {
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      margin: 10px 0;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="nav">
  <a href="appointment.html">Appointments</a>
  <a href="appointment.html">Appointments</a>
  <a href="billing.html">Billing</a>
  <a href="reports.html">Reports</a>
</div>

<div class="container">
  <h1>📊 Dashboard</h1>

  <div class="card">
    <h3>Customers</h3>
    <ul id="customers"></ul>
  </div>
</div>

<script>
const API = "https://spamate-backend.onrender.com";

fetch(`${API}/customers`)
  .then(res => res.json())
  .then(data => {
    const list = document.getElementById("customers");
    data.forEach(c => {
      const li = document.createElement("li");
      li.innerText = c.name + " - " + c.phone;
      list.appendChild(li);
    });
  });
</script>

</body>
</html>
