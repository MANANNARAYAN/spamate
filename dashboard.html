<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body style="background:#0b1b34;color:white;font-family:sans-serif">

<h1>📊 Dashboard</h1>

<h2>Customers</h2>
<h2>Customers</h2>

<input id="nameInput" type="text" placeholder="Enter customer name" />
<button onclick="addCustomer()">Add Customer</button>

<ul id="customerList"></ul>
<ul id="customers"></ul>

<script>
const API = "https://spamate-backend.onrender.com";

async function loadCustomers() {
  const res = await fetch(`${API}/api/customers`);
  const data = await res.json();

  const list = document.getElementById("customers");
  list.innerHTML = "";

  data.forEach(c => {
    const li = document.createElement("li");
    li.textContent = c.name;
    list.appendChild(li);
  });
}

loadCustomers();
</script>

</body>
</html>
