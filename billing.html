<!DOCTYPE html>
<html>
<head>
  <title>Billing</title>
</head>
<div style="background:#1e2a47;padding:10px">
  <a href="dashboard.html" style="color:white;margin-right:15px">Dashboard</a>
  <a href="appointment.html" style="color:white;margin-right:15px">Appointments</a>
  <a href="billing.html" style="color:white;margin-right:15px">Billing</a>
  <a href="reports.html" style="color:white">Reports</a>
</div>
<body style="background:#0b1b34;color:white;font-family:sans-serif">

<h1>💰 Billing</h1>

<input id="customer" placeholder="Customer">
<input id="amount" placeholder="Amount">
<button onclick="addBill()">Add</button>

<ul id="list"></ul>

<script>
const API = "https://spamate-backend.onrender.com";

async function addBill() {
  const customer = document.getElementById("customer").value;
  const amount = document.getElementById("amount").value;

  await fetch(`${API}/api/billing`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ customer, amount })
  });

  loadBilling();
}

async function loadBilling() {
  const res = await fetch(`${API}/api/billing`);
  const data = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(b => {
    const li = document.createElement("li");
    li.textContent = `${b.customer} - ₹${b.amount}`;
    list.appendChild(li);
  });
}

loadBilling();
</script>

</body>
</html>
